services:
  front:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPPORT_URL: ${NEXT_PUBLIC_SUPPORT_URL:-http://localhost:3000/login}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.groupegenetics.com}
    image: groupegenetics-front
    container_name: groupegenetics-front
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-3001}:3000"
